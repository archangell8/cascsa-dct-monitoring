[build-system]
requires = [
    "hatchling",
]

build-backend = "hatchling.build"

[project]
name = "monitoring-dct-snowflake"
dynamic = [
    "version",
]
authors = [
    { name="Francisco Junior", email="f_junior@crgl-thirdparty.com" },
]
description = "Monitoring DCT Snowflake"
readme = "README.md"
requires-python = ">=3.10.13"
dependencies = [
    "snowflake-connector-python",
    "jaydebeapi==1.2.3",
    "python-dotenv",
    "pandas",
    "PyYAML",
    "jinja2",
    "ruff",
    'tabulate',
    'pymsteams'
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    'pytest',
    'pytest-cov',
    'python-dotenv',
    'ruff',
    'taskipy',
]

[project.urls]
Homepage = "https://git.cglcloud.com/FranciscoJunior/monitoring-dct-minerva-objects"
Issues = "https://git.cglcloud.com/FranciscoJunior/monitoring-dct-minerva-objects/issues"

[tool.ruff]
line-length = 79
indent-width = 4

[tool.ruff.lint]
preview = true
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "I",   # isort
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E701"
]

[tool.ruff.format]
preview = true
quote-style = 'single'
